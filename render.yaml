# Render Blueprint — deploy backend Marbel AI satu deploy.
# Cara pakai: buat "New Blueprint" di Render, hubungkan repo ini — Render membuat service di atas.
# UPSTREAM menunjuk ke endpoint OpenAI-compatible "Zen" (opencode.ai/zen/v1), gratis dan tanpa API key.
services:
  - type: web
    name: marbel-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      # UPSTREAM: endpoint OpenAI-compatible gratis tanpa API key.
      # Zen (opencode.ai/zen) menyediakan model gratis; api.free.ai jadi cadangan.
      - key: UPSTREAM
        value: https://opencode.ai/zen,https://api.free.ai
      - key: DEFAULT_MODEL
        value: nemotron-3.5-lightning-free
      - key: MODELS_LIST
        value: nemotron-3.5-lightning-free,big-pickle,ling-3.0-flash-fin-free,nemotron-3-ultra-free,mimo-v2.5-free,qwen7b,qwen3-8b
      - key: API_KEY
        sync: false
      - key: ALLOW_ORIGIN
        value: "*"
      - key: USE_SSE
        value: "0"


