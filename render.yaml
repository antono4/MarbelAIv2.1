# Render Blueprint — deploy backend Marbel AI satu deploy.
# Cara pakai: buat "New Blueprint" di Render, hubungkan repo ini — Render membuat service di atas.
# UPSTREAM menunjuk ke endpoint OpenAI-compatible "Zen" (opencode.ai/zen/v1), gratis dan tanpa API key.
services:
  - type: web
    name: marbel-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      # UPSTREAM: endpoint OpenAI-compatible gratis (dari daftar no-cost-ai) tanpa API key.
      # uncloseai (Qwen 3.6 27B) + pollinations (GPT-OSS 20B) sebagai utama;
      # Zen (opencode.ai/zen) & api.free.ai jadi cadangan.
      - key: UPSTREAM
        value: https://hermes.ai.unturf.com,https://qwen.ai.unturf.com,https://text.openrouter.ai/api/v1,https://opencode.ai/zen,https://api.free.ai
      - key: DEFAULT_MODEL
        value: qwen3.6-27b
      - key: MODELS_LIST
        value: qwen3.6-27b,gpt-oss-20b,nemotron-3.5-lightning-free,big-pickle,ling-3.0-flash-fin-free,nemotron-3-ultra-free,mimo-v2.5-free,qwen7b,qwen3-8b
      - key: API_KEY
        sync: false
      - key: ALLOW_ORIGIN
        value: "*"
      - key: USE_SSE
        value: "0"


