<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marbel AI — Chat AI</title>
<meta name="description" content="Marbel AI — ruang kerja AI untuk mengobrol, membuat gambar, dan membuat ilustrasi video." />
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12121c" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c5ce7'/%3E%3Cstop offset='1' stop-color='%2300b8a9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M16 5l2.3 6.9a2.4 2.4 0 0 0 1.5 1.5L26.7 16l-6.9 2.3a2.4 2.4 0 0 0-1.5 1.5L16 26.7l-2.3-6.9a2.4 2.4  0 0 0-1.5-1.5L5.3 16l6.9-2.3a2.4 2.4 0 0 0-1.5-1.5L16 5z'/%3E%3Ccircle cx='24.5' cy='24.5' r='2.2' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- latar halus ala Claude -->
  <div class="bg-scene" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
  </div>

  <div class="layout">
    <!-- ============ Sidebar kiri: brand + percakapan ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Riwayat percakapan">
      <div class="sidebar-head">
        <div class="brand-mark">
          <svg class="brand-ico" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-label="Logo Marbel AI">
            <path d="M12 2.5l1.7 5.1a2.2 2.2 0 0 0 1.4 1.4l5.1 1.7-5.1 1.7a2.2 2.2 0 0 0-1.4 1.4L12 18.9l-1.7-5.1a2.2 2.2 0 0 0-1.4-1.4L3.8 10.7l5.1-1.7a2.2 2.2 0 0 0 1.4-1.4L12 2.5z"/>
            <circle cx="19" cy="19" r="2.1"/>
            <circle cx="5" cy="17.5" r="1.4"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Marbel<span class="brand-high">AI</span></span>
          <span class="brand-tag">AI Workspace</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Mode siang/malam" aria-label="Ganti mode siang/malam" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7.5 7.5 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
        <button class="panel-hide" id="panelHide" title="Sembunyikan panel" aria-label="Sembunyikan panel" aria-expanded="true" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
        </button>
      </div>

      <button class="new-thread" id="newThread" title="Mulai percakapan baru">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Percakapan Baru</span>
      </button>

      <nav class="conv-bar" aria-label="Percakapan">
        <span class="conv-label">Percakapan</span>
        <ul id="threadList" class="thread-list"></ul>
      </nav>

      <div class="sidebar-foot">Marbel AI</div>
    </aside>

    <!-- ============ Kolom utama ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="header-pill"><span class="hp-dot"></span>Marbel AI</span>
        </div>
        <div class="topbar-right">
          <div class="status-row" role="status" aria-live="polite">
            <span id="statusDot" class="dot" aria-hidden="true"></span>
            <span id="statusIcon" class="status-icon" title="Mencoba lagi…" aria-hidden="true">
              <svg class="icon-spinner" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <path d="M12 2a10 10 0 0 1 10 10"/>
              </svg>
              <span class="live-dot"></span>
              <span class="ping-ring"></span>
              <span class="ping-ring two"></span>
            </span>
            <span id="statusLabel">menghubungkan…</span>
          </div>
          <button class="side-btn" id="sideToggle" title="Sembunyikan sidebar" aria-label="Sembunyikan sidebar" aria-expanded="true" aria-controls="sidebar">☰</button>
        </div>
      </header>

      <div class="workspace">
        <div id="threadWrap" class="thread-wrap">
          <!-- Welcome screen -->
          <div id="welcome" class="welcome">
            <div class="welcome-inner">
              <span class="eyebrow">✦ Selamat datang di Marbel AI</span>
              <h2>Mari mulai <span class="grad">berkarya</span></h2>
            </div>
          </div>

          <!-- Area chat -->
          <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Percakapan dengan Marbel AI"></div>
          <div id="activeBadge" class="active-badge" role="status">
            <span class="spark-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2l1.9 5.7a2 2 0 0 0 1.3 1.3L21 11l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 20l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 11l5.8-2a2 2 0 0 0 1.3-1.3L12 2z"/></svg>
            </span>
            <span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="sr-only">Marbel AI sedang menulis jawaban…</span>
          </div>
        </div>
      </div>

      <!-- ============ Composer ============ -->
      <form id="form" class="composer" autocomplete="off">
        <textarea id="input" rows="3" placeholder="Tanya apa saja ke Marbel AI…" aria-label="Pesan"></textarea>
        <div class="composer-footer">
          <div class="cf-left">
            <label class="custom-select">
              <span class="cs-label">Model</span>
              <select id="model">
                <option value="semua" selected>Auto Model (Tercepat)</option>
                <option value="qwen3.8-27b">qwen3.8-27b</option>
                <option value="gpt-oss-20b">gpt-oss-20b</option>
                <option value="qwen3-8b">qwen3-8b</option>
              </select>
            </label>
          </div>
          <div class="cf-actions">
            <button type="button" id="mediaImage" class="media-btn" data-mode="image" title="Buat gambar dari teks" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M20 15l-5-5-8 8"/></svg>
              <span>Gambar</span>
            </button>
            <button type="button" id="mediaVideo" class="media-btn" data-mode="video" title="Buat ilustrasi video dari teks" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="14" height="14" rx="3"/><path d="M16.5 10.5l5-3v9l-5-3z"/></svg>
              <span>Video</span>
            </button>
            <button id="send" type="submit" class="send" title="Kirim" aria-label="Kirim pesan">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
